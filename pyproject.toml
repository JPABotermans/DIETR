[project]
name = "dietr"
dynamic = ["version"]
description = "DIETR project"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "einops>=0.8.1",
    "msgpack>=1.1.2",
    "numpy>=1.26.4",
    "matplotlib>=3.10.3",
    "opencv-python>=4.11.0.86",
    "pycocotools>=2.0.10",
    "pyyaml>=6.0.2",
    "scipy>=1.16.0",
    "tqdm>=4.67.1",
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]

[project.optional-dependencies]
cu128 = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
cu121 = [
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]
cpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[tool.uv]
conflicts = [
    [
        { extra = "cu128" },
        { extra = "cu121" },
        { extra = "cpu" },
    ],
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cpu", extra = "cpu" },

]
torchvision = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cpu", extra = "cpu" },

]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "tensorboard>=2.16.2",
    "wandb>=0.21.0",
]
